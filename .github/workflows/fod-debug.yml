name: FOD debug APK

on:
  push:
    branches: [feat/fodmod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fod-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Keep the debug signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: oneuix-fod-debug-keystore-v1
      - name: Label the separate debug app
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/fod_debug.xml <<'XML'
          <resources><string name="app_name">OneUIX FOD debug</string></resources>
          XML
      - name: Test, lint hooks, and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :app:testDebugUnitTest :hook:testDebugUnitTest :hook:lintDebug :app:assembleDebug -Poneuix.applicationId=io.github.cybr47.oneuix.fodmod
      - name: Name APK
        run: mv app/build/outputs/apk/debug/app-debug.apk OneUIX-FOD-Debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-FOD-Debug
          path: OneUIX-FOD-Debug.apk
          retention-days: 15
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FOD-check-reports
          path: |
            common/build/reports/tests/
            app/build/reports/tests/
            hook/build/reports/tests/
            hook/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 15
