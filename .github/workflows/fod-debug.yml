name: FOD debug APK

on:
  push:
    branches: [feat/fodmod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fod-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feat/fodmod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check signing setup and FOD security boundaries
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_fod_signing.py'
          python3 .github/scripts/check_fod_security.py
      - name: Sign with the existing repository key
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: python3 .github/scripts/prepare_fod_signing.py
      - name: Label the separate debug app
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/fod_debug.xml <<'XML'
          <resources><string name="app_name">OneUIX FOD debug</string></resources>
          XML
      - name: Test, lint hooks, and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :app:testDebugUnitTest :hook:testDebugUnitTest :hook:lintDebug :app:assembleDebug --no-configuration-cache -Poneuix.applicationId=io.github.cybr47.oneuix.fodmod
      - name: Name APK
        run: mv app/build/outputs/apk/debug/app-debug.apk OneUIX-FOD-Debug.apk
      - name: Check packaged FOD permission
        run: |
          apkanalyzer manifest print OneUIX-FOD-Debug.apk > fod-manifest.xml
          python3 .github/scripts/check_fod_security.py --manifest fod-manifest.xml
      - name: Review application and common lint
        id: broader_lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug :common:lintDebug --continue --no-configuration-cache -Poneuix.applicationId=io.github.cybr47.oneuix.fodmod
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OneUIX-FOD-Debug
          path: OneUIX-FOD-Debug.apk
          retention-days: 15
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FOD-check-reports
          path: |
            common/build/reports/tests/
            app/build/reports/tests/
            hook/build/reports/tests/
            hook/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug.*
            common/build/reports/lint-results-debug.*
            fod-manifest.xml
          if-no-files-found: ignore
          retention-days: 15
      - name: Remove signing material
        if: always()
        run: rm -f app/fod-signing.p12 keystore.properties
