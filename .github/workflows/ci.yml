name: CI

# 触发条件：所有分支的 push 和 PR 都会触发
on:
  push:
    branches-ignore: [feat/audio-eraser-tile, feat/fodmod, feat/statusmod]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      # 仓库内的构建使用与 Release 相同的签名，以便互相覆盖安装。
      # Fork PR 无法访问 Secrets，因此只做编译检查，不上传 APK。
      - name: Set up signing
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: python3 .github/scripts/prepare_fod_signing.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 获取当前 commit 的前 7 位短 Hash，并存入环境变量 SHORT_SHA 中
      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 构建 Debug 包
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify Debug signature
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          EXPECTED_CERT_SHA256=$(keytool -list -v -keystore app/fod-signing.p12 -storepass:env P12_PASSWORD -storetype PKCS12 | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '\r')
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ -z "$EXPECTED_CERT_SHA256" ] || [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Debug signing certificate does not match the repository P12"
            exit 1
          fi
          echo "Verified debug signing certificate matches repository P12."

      # 重命名 Debug 包
      # github.ref_name: 分支名 (例如 main)
      # github.run_number: Actions 的历史运行编号 (例如 15)
      # env.SHORT_SHA: 刚刚获取的 7 位 commit 标识 (例如 a1b2c3d)
      - name: Rename APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      # 上传产物
      - name: Upload APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          # name: OneUIX-Debug-${{ github.ref_name }}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false

      - name: Remove signing material
        if: always()
        run: python3 -c 'from pathlib import Path; Path("app/fod-signing.p12").unlink(missing_ok=True); Path("keystore.properties").unlink(missing_ok=True)'
