name: Search bar debug APK

on:
  push:
    branches:
      - feat/searchbarmod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-SearchBar-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
