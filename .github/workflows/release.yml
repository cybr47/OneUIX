name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up signing
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set +x
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Signing secrets (P12_BASE64, P12_PASSWORD) are not fully configured"
            exit 1
          fi
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > app/release.p12
          KEY_ALIAS=$(java -e '
            import java.io.FileInputStream;
            import java.security.KeyStore;
            public class GetAlias {
              public static void main(String[] args) throws Exception {
                KeyStore ks = KeyStore.getInstance("PKCS12");
                try (FileInputStream fis = new FileInputStream("app/release.p12")) {
                  ks.load(fis, System.getenv("P12_PASSWORD").toCharArray());
                }
                if (ks.aliases().hasMoreElements()) {
                  System.out.print(ks.aliases().nextElement());
                }
              }
            }
          ' 2>/dev/null || keytool -list -v -keystore app/release.p12 -storepass "$P12_PASSWORD" -storetype PKCS12 | sed -n 's/^Alias name: //p' | head -n 1 | tr -d '\r')

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Could not determine keyAlias from P12 file"
            exit 1
          fi
          echo "::add-mask::$KEY_ALIAS"
          KEY_ALIAS="$KEY_ALIAS" java -e '
            import java.io.FileOutputStream;
            import java.util.Properties;
            public class WriteProps {
              public static void main(String[] args) throws Exception {
                Properties p = new Properties();
                p.setProperty("storeFile", "release.p12");
                p.setProperty("storePassword", System.getenv("P12_PASSWORD"));
                p.setProperty("keyAlias", System.getenv("KEY_ALIAS"));
                p.setProperty("keyPassword", System.getenv("P12_PASSWORD"));
                try (FileOutputStream fos = new FileOutputStream("keystore.properties")) {
                  p.store(fos, null);
                }
              }
            }
          ' 2>/dev/null || {
            printf 'storeFile=release.p12\n'
            printf 'storePassword=%s\n' "$P12_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$P12_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Remove signing files
        if: always()
        run: rm -f app/release.p12 keystore.properties

      - name: Verify Release signature
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set +x
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found"
            exit 1
          fi

          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/verify.p12"
          EXPECTED_CERT_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/verify.p12" -storepass "$P12_PASSWORD" -storetype PKCS12 | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '\r')
          rm -f "$RUNNER_TEMP/verify.p12"

          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Verified signing certificate matches P12 keystore."

      - name: Rename APK
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/OneUIX_${NAME}.apk"
          echo "ARTIFACT_NAME=OneUIX_${NAME}" >> "$GITHUB_ENV"

      - name: Upload APK Artifact to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/release/OneUIX_*.apk
          if-no-files-found: error

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/OneUIX_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
